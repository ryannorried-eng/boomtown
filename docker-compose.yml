services:
  boomtown-backend:
    build:
      context: ./backend
    container_name: boomtown-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: boomtown-postgres
    environment:
      POSTGRES_USER: boomtown
      POSTGRES_PASSWORD: boomtown
      POSTGRES_DB: boomtown
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boomtown -d boomtown"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
